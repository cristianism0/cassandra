name: cassandra
arch: amd64
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: cristian <csg2099@gmail.com>
description: |
  Cassandra — fast Rust CLI for Linux logs (journald, auth, syslog, wtmp).
  Cross-distro, RFC 3164, streaming raw, pager less -S -R.
vendor: cristianism0
homepage: https://github.com/cristianism0/cassandra
license: GPL-3.0
contents:
  - src: ./target/release/cassandra
    dst: /usr/bin/cassandra
    file_info:
      mode: 0755
  - src: ./README.md
    dst: /usr/share/doc/cassandra/README.md
  - src: ./LICENSE
    dst: /usr/share/doc/cassandra/LICENSE
overrides:
  deb:
    depends:
      - libc6 (>= 2.34)
      - libsystemd0
  rpm:
    depends:
      - glibc >= 2.34
      - systemd-libs
  archlinux:
    depends:
      - glibc>=2.34
      - systemd-libs
rpm:
  summary: Fast Rust CLI for Linux logs
  packager: cristian <csg2099@gmail.com>
  group: System Environment/Base
